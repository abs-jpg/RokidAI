server {
    listen 80;
    listen [::]:80;
    server_name karaoke-api.palerider6.com;
    root /www/wwwroot/karaoke-api.palerider6.com;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/karaoke-api.palerider6.com;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name karaoke-api.palerider6.com;
    root /www/wwwroot/karaoke-api.palerider6.com;
    index index.html;

    ssl_certificate /www/server/panel/vhost/letsencrypt/karaoke-api.palerider6.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/karaoke-api.palerider6.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_cache off;
        client_max_body_size 64k;
    }
}
