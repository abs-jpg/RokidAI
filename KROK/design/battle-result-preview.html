<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多人联机结算界面设计</title>
  <style>
    :root {
      --ink: #080b0d;
      --surface: #101516;
      --green: #4cc773;
      --win: #ff6573;
      --muted: #a8b0b4;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(76, 199, 115, 0.08), transparent 40%),
        #070a0b;
      color: #fff;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .sheet {
      display: flex;
      width: 1008px;
      height: 352px;
      gap: 48px;
      align-items: center;
      justify-content: center;
    }

    .device {
      width: 480px;
      height: 352px;
      padding: 12px 16px;
      overflow: hidden;
      background: var(--ink);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
    }

    .screen {
      position: relative;
      display: flex;
      width: 448px;
      height: 328px;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 101, 115, 0.055), transparent 33%),
        var(--surface);
    }

    .screen.loss {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 68%),
        var(--surface);
    }

    .corner {
      position: absolute;
      width: 44px;
      height: 1px;
      background: rgba(76, 199, 115, 0.25);
    }

    .corner.left { top: 16px; left: 16px; }
    .corner.right { top: 16px; right: 16px; }

    .result {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 16px 0;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: rgba(76, 199, 115, 0.56);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 4px;
    }

    .badge {
      display: flex;
      width: 126px;
      height: 126px;
      align-items: center;
      justify-content: center;
      border: 4px solid var(--muted);
      border-radius: 63px;
      background: rgba(255, 255, 255, 0.025);
    }

    .badge.win {
      border-color: var(--win);
      background: rgba(255, 101, 115, 0.06);
      box-shadow: 0 0 18px rgba(255, 101, 115, 0.18);
    }

    .badge-title {
      color: #b7bec2;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 5px;
      line-height: 1;
      transform: translateX(2px);
    }

    .badge.win .badge-title { color: var(--win); }

    .scores {
      display: flex;
      width: 280px;
      height: 50px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .score-cell {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-role {
      color: rgba(76, 199, 115, 0.48);
      font-size: 10px;
      line-height: 12px;
    }

    .score-value {
      color: rgba(76, 199, 115, 0.82);
      font-size: 25px;
      font-weight: 700;
      line-height: 29px;
    }

    .leading .score-value { color: var(--win); }

    .score-separator {
      width: 1px;
      height: 30px;
      background: rgba(76, 199, 115, 0.20);
    }

    .hintbar {
      display: flex;
      height: 22px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-top: 1px solid rgba(76, 199, 115, 0.22);
    }

    .hint-dot {
      width: 4px;
      height: 4px;
      border-radius: 2px;
      background: var(--green);
      box-shadow: 0 0 7px rgba(76, 199, 115, 0.5);
    }

    .hint-text {
      color: rgba(76, 199, 115, 0.66);
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="device" aria-label="胜利侧">
      <div class="screen win">
        <span class="corner left"></span>
        <span class="corner right"></span>
        <div class="result">
          <div class="eyebrow">本局结算</div>
          <div class="badge win">
            <div class="badge-title">胜利</div>
          </div>
          <div class="scores">
            <div class="score-cell leading">
              <div class="score-role">你</div>
              <div class="score-value">92</div>
            </div>
            <div class="score-separator"></div>
            <div class="score-cell">
              <div class="score-role">对手</div>
              <div class="score-value">87</div>
            </div>
          </div>
        </div>
        <div class="hintbar">
          <span class="hint-dot"></span>
          <span class="hint-text">点按镜腿 · 确认离开</span>
        </div>
      </div>
    </section>

    <section class="device" aria-label="失败侧">
      <div class="screen loss">
        <span class="corner left"></span>
        <span class="corner right"></span>
        <div class="result">
          <div class="eyebrow">本局结算</div>
          <div class="badge">
            <div class="badge-title">失败</div>
          </div>
          <div class="scores">
            <div class="score-cell">
              <div class="score-role">你</div>
              <div class="score-value">87</div>
            </div>
            <div class="score-separator"></div>
            <div class="score-cell leading">
              <div class="score-role">对手</div>
              <div class="score-value">92</div>
            </div>
          </div>
        </div>
        <div class="hintbar">
          <span class="hint-dot"></span>
          <span class="hint-text">点按镜腿 · 确认离开</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
