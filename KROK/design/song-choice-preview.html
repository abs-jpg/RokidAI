<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K 歌 · 选歌交互预览</title>
  <style>
/* Glasses layout from pages/home/home.ink */
:root {
  --green-100: #4cc773;
  --green-72: rgba(76,199,115,0.72);
  --green-48: rgba(76,199,115,0.48);
  --green-24: rgba(76,199,115,0.24);
  --green-12: rgba(76,199,115,0.12);
  --green-06: rgba(76,199,115,0.06);
}

.page-root {
  display: flex;
  flex-direction: column;
  position: relative;
  width: 448px;
  height: 328px;
  margin: 12px 16px;
  padding: 0;
}

.main-view {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}

.topbar {
  display: flex;
  flex-direction: row;
  align-items: center;
  height: 36px;
  padding: 0 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(76,199,115,0.40);
}

.title {
  font-size: 20px;
  font-weight: bold;
  color: var(--green-100);
}

.song-list {
  flex: 1 1 auto;
  min-height: 0;
  padding: 16px 12px;
}

.song-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  height: 54px;
  padding: 0 8px;
  margin-bottom: 4px;
}

.song-marker {
  width: 16px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.song-dot {
  width: 6px;
  height: 6px;
  background-color: var(--green-100);
}

.song-info {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: 0;
  margin-left: 8px;
}

.song-name {
  font-size: 22px;
  color: var(--green-100);
}

.song-artist {
  font-size: 14px;
  color: var(--green-72);
  margin-top: 1px;
}

.song-diff {
  font-size: 12px;
  color: var(--green-48);
  flex-shrink: 0;
}

.song-badge {
  font-size: 10px;
  color: var(--green-48);
  border: 1px solid var(--green-24);
  padding: 1px 4px;
  margin-right: 6px;
  flex-shrink: 0;
}

.song-tag {
  font-size: 10px;
  color: #041006;
  background-color: var(--green-72);
  padding: 1px 5px;
  margin-right: 6px;
  flex-shrink: 0;
}

.nav-row {
  display: flex;
  flex-direction: row;
  height: 40px;
  padding: 0 12px;
  flex-shrink: 0;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  height: 40px;
}

.nav-marker {
  width: 100%;
  height: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-dot {
  width: 5px;
  height: 5px;
  background-color: var(--green-100);
}

.nav-label {
  font-size: 16px;
  color: var(--green-72);
  margin-top: 2px;
}

.hintbar {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  height: 24px;
  flex-shrink: 0;
  padding: 0 12px;
}

.hint-text {
  font-size: 14px;
  color: var(--green-72);
}

.choice-mask {
  position: absolute;
  left: 0;
  top: 0;
  overflow: hidden;
  z-index: 10;
}

.choice-panel, .choice-canvas {
  position: absolute;
  left: 0;
  top: 0;
}

.choice-panel {
  width: 100%;
  height: 100%;
  animation: choice-emerge 300ms ease-out both;
}

.choice-canvas {
  z-index: 2;
  pointer-events: none;
}

.choice-header {
  display: flex;
  position: absolute;
  flex-direction: column;
  align-items: center;
  left: 14px;
  right: 14px;
  top: 23px;
}

.choice-sub {
  color: var(--green-72);
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 5px;
}

.choice-title {
  max-width: 100%;
  color: var(--green-100);
  font-size: 23px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.choice-option {
  display: flex;
  position: absolute;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  border: 1px solid var(--green-48);
  border-radius: 5px;
  background-color: var(--green-06);
}

.choice-label {
  color: var(--green-100);
  font-size: 19px;
  font-weight: bold;
  line-height: 23px;
}

.choice-desc {
  color: var(--green-72);
  font-size: 12px;
  line-height: 16px;
}

.choice-active {
  border-color: var(--green-100);
  background-color: var(--green-12);
  box-shadow: 0 0 11px rgba(76,199,115,0.26);
}

.choice-disabled {
  border-color: var(--green-24);
}

.choice-disabled .choice-label, .choice-disabled .choice-desc {
  color: var(--green-48);
}

.choice-footer {
  position: absolute;
  bottom: 13px;
  left: 12px;
  right: 12px;
  text-align: center;
}

.choice-hint {
  color: var(--green-72);
  font-size: 12px;
}

.choice-compact .choice-header { top: 4px; }
.choice-compact .choice-sub { font-size: 9px; margin-bottom: 1px; }
.choice-compact .choice-title { font-size: 16px; }
.choice-compact .choice-label { font-size: 14px; line-height: 16px; }
.choice-compact .choice-desc { font-size: 10px; line-height: 12px; }
.choice-compact .choice-footer { bottom: 3px; }
.choice-compact .choice-hint { font-size: 10px; }

@keyframes choice-emerge {
  from { opacity: 0; transform: scale(0.94); }
  to { opacity: 1; transform: scale(1); }
}

.song-dot, .nav-dot {
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 190ms ease, transform 190ms ease;
}

.song-dot.dot-on, .nav-dot.dot-on {
  opacity: 1;
  transform: scale(1);
}

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: 28px 16px;
      place-items: center;
      background: radial-gradient(ellipse at 50% 12%, #192720, #0b100e 64%);
      color: #e0ebe3;
      font: 14px/1.6 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }
    main { display: grid; max-width: 100%; gap: 20px; justify-items: center; }
    header { text-align: center; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0.03em; }
    p { margin: 0; }
    header p { margin-top: 5px; color: #a4b9aa; }
    .eyepiece {
      max-width: 100%;
      overflow: auto;
      border: 1px solid #33473b;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 22px 55px #0008;
    }
    .page-root { line-height: 1.3; overflow: hidden; touch-action: none; }
    .page-root:focus-visible { outline: 1px solid var(--green-72); outline-offset: -1px; }
    .song-item {
      width: 100%;
      border: 1px solid var(--green-24);
      border-radius: 5px;
      background: var(--green-06);
      text-align: left;
      cursor: pointer;
    }
    .song-item:hover { border-color: var(--green-72); }
    .choice-title { text-align: center; }
    .choice-option { user-select: none; }
    .preview-result {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: var(--green-100);
    }
    .preview-result strong { font-size: 32px; }
    .preview-result span { color: var(--green-72); }
    .controls { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
    .controls button, .controls label {
      display: flex;
      align-items: center;
      min-height: 38px;
      gap: 6px;
      color: #deebe1;
      background: #152019;
      border: 1px solid #374a3d;
      border-radius: 7px;
      padding: 7px 11px;
      font: inherit;
      cursor: pointer;
    }
    .controls button:hover, .controls label:hover { background: #203228; }
    .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--green-100); }
    .controls input { accent-color: #61d28a; }
    .status { color: #a4b9aa; text-align: center; min-height: 1.6em; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>K 歌 · 选歌交互预览</h1>
      <p>移动鼠标模拟转头，瞄准按钮等圆环走完一圈。</p>
    </header>
    <div class="eyepiece">
      <div class="page-root" id="screen" role="region" aria-label="眼镜画面" tabindex="0">
        <div class="main-view" id="library" hidden>
          <div class="topbar"><span class="title">K 歌</span></div>
          <div class="song-list">
            <button class="song-item" id="choose-song" type="button">
              <span class="song-marker"><span class="song-dot dot-on"></span></span>
              <span class="song-info"><span class="song-name">稻香</span><span class="song-artist">周杰伦</span></span>
            </button>
          </div>
          <div class="hintbar"><span class="hint-text">点击歌曲选择版本</span></div>
        </div>
        <div class="choice-mask" id="scene">
          <div class="choice-panel" id="choice-panel" hidden>
            <div class="choice-header">
              <span class="choice-sub">选择演唱版本</span>
              <span class="choice-title">稻香</span>
            </div>
            <div class="choice-option" id="guide">
              <span class="choice-label">带歌词版</span>
              <span class="choice-desc">伴奏与跟唱引导</span>
            </div>
            <div class="choice-option" id="instrumental">
              <span class="choice-label">伴奏版</span>
              <span class="choice-desc">纯伴奏 · 自己唱</span>
            </div>
            <div class="choice-option" id="phrase">
              <span class="choice-label">练这一句</span>
              <span class="choice-desc">暂未开放</span>
            </div>
            <div class="choice-footer"><span class="choice-hint" id="hint"></span></div>
          </div>
          <canvas class="choice-canvas" id="canvas" aria-hidden="true"></canvas>
        </div>
        <div class="preview-result" id="result" hidden>
          <span>准备演唱 · 稻香</span>
          <strong id="chosen-version"></strong>
          <span>双击镜腿返回</span>
        </div>
      </div>
    </div>
    <div class="controls" aria-label="预览控制">
      <button id="replay" type="button">重放转场</button>
      <button id="temple" type="button">模拟镜腿（双击）</button>
      <label><input id="only-guide" type="checkbox">仅下载歌词版</label>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
  <script type="module">
// Glasses canvas and dwell controller from utils/songChoice.js.
const TRANSITION_MS = 800
const DWELL_MS = 950
const CONFIRM_FRAME_MS = 80
const READING_GAP_MS = 320
const SENSOR_TIMEOUT_MS = 900
const SENSOR_HZ = 60
const MAX_CURSOR_STEP_PX = 18
const FULL_TURN = Math.PI * 2
const GREEN = '#4cc773'

export const phraseAimSession = { current: null }

export function songChoiceLayout(viewportWidth, viewportHeight) {
  const width = viewportWidth > 0 ? Math.min(448, Math.max(1, Math.floor(viewportWidth) - 32)) : 448
  const height = viewportHeight > 0 ? Math.min(328, Math.max(1, Math.floor(viewportHeight) - 24)) : 328
  const compact = height <= 176 || width < 300
  const cardWidth = Math.min(156, Math.floor(width * 0.39))
  const cardHeight = Math.min(60, Math.floor(height * (compact ? 0.22 : 0.20)))
  const gap = Math.floor(width * 0.036)
  const top = Math.round(height * 0.30)
  const bottom = Math.round(height * 0.61)
  const leftCenter = Math.floor(width / 2)
  const boxes = [
    { x: leftCenter - gap - cardWidth, y: top },
    { x: leftCenter + gap, y: top },
    { x: Math.floor((width - cardWidth) / 2), y: bottom }
  ].map(({ x, y }) => ({
    x, y, width: cardWidth, height: cardHeight,
    style: `left:${x}px;top:${y}px;width:${cardWidth}px;height:${cardHeight}px;`
  }))
  return { width, height, compact, boxes }
}

function normalizedQuaternion(value) {
  if (!value || value.length !== 4 || !Array.from(value).every(Number.isFinite)) return null
  const length = Math.hypot(...value)
  return length > 0 ? Array.from(value, part => part / length) : null
}

// Rotate the screen's forward axis (-Z) by the pose relative to the centered pose.
function relativeAim([a, b, c, d], [x, y, z, w]) {
  const rx = d * x - a * w - b * z + c * y
  const ry = d * y + a * z - b * w - c * x
  const rz = d * z - a * y + b * x - c * w
  const rw = d * w + a * x + b * y + c * z
  const forwardX = -2 * (rx * rz + rw * ry)
  const forwardY = -2 * (ry * rz - rw * rx)
  const forwardZ = -1 + 2 * (rx * rx + ry * ry)
  return [Math.atan2(forwardX, -forwardZ), Math.atan2(forwardY, Math.hypot(forwardX, forwardZ))]
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value))
}

function drawTunnel(ctx, width, height, progress) {
  const cx = width * (0.50 + Math.sin(progress * Math.PI) * 0.022)
  const cy = height * 0.49
  const opacity = Math.min(1, progress * 9, (1 - progress) * 6)
  const travel = progress + progress * progress * 5
  ctx.lineWidth = 1.2
  let farthest
  let nearest
  for (let index = 0; index < 7; index++) {
    const depth = 0.46 + ((index + 7 - travel) % 7) * 0.37
    const twist = 0.12 * (depth - 1) - progress * 0.34
    const corners = Array.from({ length: 8 }, (_, side) => {
      const angle = (side + 0.5) * FULL_TURN / 8 + twist
      return [cx + Math.cos(angle) * width * 0.32 / depth, cy + Math.sin(angle) * height * 0.37 / depth]
    })
    if (!farthest || depth > farthest.depth) farthest = { depth, corners }
    if (!nearest || depth < nearest.depth) nearest = { depth, corners }
    ctx.strokeStyle = `rgba(76,199,115,${opacity * (0.18 + 0.50 / (1 + depth))})`
    ctx.beginPath()
    ctx.moveTo(...corners[7])
    for (const point of corners) ctx.lineTo(...point)
    ctx.stroke()
  }
  ctx.strokeStyle = `rgba(76,199,115,${opacity * 0.23})`
  ctx.beginPath()
  for (let index = 0; index < 8; index++) {
    ctx.moveTo(...farthest.corners[index])
    ctx.lineTo(...nearest.corners[index])
  }
  ctx.stroke()
  ctx.strokeStyle = `rgba(76,199,115,${opacity * 0.65})`
  ctx.beginPath()
  for (let index = 0; index < 22; index++) {
    const angle = index * 2.39996
    const radius = 0.09 + ((index * 0.373 + progress * (0.3 + progress * 1.22)) % 1) * 0.66
    const dx = Math.cos(angle) * width * radius
    const dy = Math.sin(angle) * height * radius
    ctx.moveTo(cx + dx * 0.89, cy + dy * 0.89)
    ctx.lineTo(cx + dx, cy + dy)
  }
  ctx.stroke()
}

function drawReticle(ctx, x, y, progress) {
  ctx.lineWidth = 1
  ctx.strokeStyle = 'rgba(76,199,115,0.60)'
  ctx.beginPath()
  ctx.arc(x, y, 12, 0, FULL_TURN)
  ctx.stroke()
  ctx.fillStyle = GREEN
  ctx.beginPath()
  ctx.arc(x, y, 2, 0, FULL_TURN)
  ctx.fill()
  if (progress <= 0) return
  ctx.lineWidth = 2.5
  ctx.strokeStyle = GREEN
  ctx.beginPath()
  ctx.arc(x, y, 12, -Math.PI / 2, -Math.PI / 2 + FULL_TURN * progress)
  ctx.stroke()
}

export class SongChoice {
  constructor(page, layout, createCanvas) {
    this.page = page
    this.layout = layout
    this.createCanvas = createCanvas
    this.focus = -1
    this.latched = -1
    this.aimWidth = layout.width
    this.aimHeight = layout.height
    this.center()
  }

  center() {
    this.x = this.aimWidth / 2
    this.y = this.aimHeight / 2
    this.anchorToCursor()
  }

  anchorToCursor() {
    this.targetX = this.x
    this.targetY = this.y
    this.yaw = (this.x / this.aimWidth - 0.5) * 0.65
    this.pitch = (0.5 - this.y / this.aimHeight) * 0.50
    this.basePose = null
    this.gyroAt = null
    this.lastReadingAt = null
  }

  start({ transition = true } = {}) {
    this.active = true
    this.startedAt = performance.now()
    this.transition = transition
    this.startSensor('absolute')
    this.frame = requestAnimationFrame(() => this.draw())
  }

  bindPage(page, layout, createCanvas) {
    if (this.page === page) return
    this.unbindPage(this.page)
    this.clearIdleTimer()
    this.page = page
    this.layout = layout
    this.createCanvas = createCanvas
    this.startedAt = performance.now()
    this.transition = false
    this.ready = false
    this.firstFrame = true
    this.canvasUnavailable = false
    this.x = clamp(this.x, 13, Math.max(13, layout.width - 13))
    this.y = clamp(this.y, 13, Math.max(13, layout.height - 13))
    this.requireMove()
    if (!this.sensor) {
      const kind = this.fallback ? 'absolute' : this.sensorKind
      this.fallback = false
      this.startSensor(kind)
    }
    this.frame = requestAnimationFrame(() => this.draw())
  }

  unbindPage(page) {
    if (!page || this.page !== page) return
    if (this.frame != null) cancelAnimationFrame(this.frame)
    this.frame = null
    const ctx = this.context
    this.context = null
    if (ctx) {
      try {
        ctx.clearRect(0, 0, this.layout.width, this.layout.height)
        ctx.flush()
      } catch { /* The host may have already removed this canvas. */ }
    }
    this.page = null
    this.createCanvas = null
    this.focus = -1
    this.latched = -1
    if (this.worldPage) {
      this.stopSensor()
      this.anchorToCursor()
    } else if (this.active && this.sensor) {
      // Keep sampling during navigation, and release the sensor if the app stays hidden.
      this.idleTimer = setTimeout(() => {
        this.idleTimer = null
        this.stopSensor()
        this.anchorToCursor()
      }, SENSOR_TIMEOUT_MS)
    }
  }

  clearIdleTimer() {
    if (this.idleTimer != null) clearTimeout(this.idleTimer)
    this.idleTimer = null
  }

  startSensor(kind) {
    this.sensorKind = kind
    let sensor
    try {
      if (kind === 'absolute') {
        if (typeof AbsoluteOrientationSensor === 'function') {
          sensor = new AbsoluteOrientationSensor({ frequency: SENSOR_HZ })
        }
      } else if (kind === 'page') {
        if (!this.page) return
        if (typeof this.page.enableWorldAwareness === 'function') {
          this.worldPage = this.page
          this.worldPage.enableWorldAwareness()
          sensor = this.worldPage.orientationSensor
        }
      } else if (typeof Gyroscope === 'function') {
        sensor = new Gyroscope({ frequency: SENSOR_HZ })
      }
      if (!sensor) {
        this.sensorFailed(kind)
        return
      }
      this.sensor = sensor
      this.sensorStartedAt = performance.now()
      this.onSensorReading = () => { if (this.sensor === sensor) this.readSensor(sensor, kind) }
      this.onSensorError = () => { if (this.sensor === sensor) this.sensorFailed(kind) }
      sensor.addEventListener('reading', this.onSensorReading)
      sensor.addEventListener('error', this.onSensorError)
      if (!this.worldPage) sensor.start()
    } catch (error) {
      console.warn('方向传感器不可用', error)
      this.sensorFailed(kind)
    }
  }

  sensorFailed(kind) {
    this.stopSensor()
    this.anchorToCursor()
    if (this.page) this.requireMove()
    if (kind === 'absolute') return this.startSensor('page')
    if (kind === 'page') return this.startSensor('gyro')
    this.fallback = true
    if (this.ready) this.page?.showChoiceControls(true)
  }

  stopSensor() {
    const sensor = this.sensor
    this.sensor = null
    try {
      if (sensor) {
        sensor.removeEventListener('reading', this.onSensorReading)
        sensor.removeEventListener('error', this.onSensorError)
      }
      if (this.worldPage) this.worldPage.disableWorldAwareness?.()
      else sensor?.stop()
    } catch (error) {
      console.warn('停止方向传感器失败', error)
    } finally {
      this.worldPage = null
    }
  }

  stop() {
    this.active = false
    this.clearIdleTimer()
    this.unbindPage(this.page)
    this.stopSensor()
  }

  readSensor(sensor, kind) {
    if (!this.active || !sensor.hasReading) return
    const now = performance.now()
    if (kind !== 'gyro') {
      const pose = normalizedQuaternion(sensor.quaternion)
      if (!pose) return
      if (!this.basePose) {
        this.basePose = pose
        this.yawOffset = this.yaw
        this.pitchOffset = this.pitch
      }
      const [yaw, pitch] = relativeAim(this.basePose, pose)
      this.yaw = this.yawOffset + yaw
      this.pitch = this.pitchOffset + pitch
    } else {
      if (![sensor.x, sensor.y, sensor.z].every(Number.isFinite)) return
      const gap = now - (this.gyroAt ?? -Infinity)
      const elapsed = gap <= READING_GAP_MS ? Math.min(gap / 1000, 0.05) : 0
      this.gyroAt = now
      this.yaw = clamp(this.yaw - sensor.y * elapsed, -0.52, 0.52)
      this.pitch = clamp(this.pitch + sensor.x * elapsed, -0.44, 0.44)
    }
    this.lastReadingAt = now
    this.targetX = this.aimWidth * (0.5 + this.yaw / 0.65)
    this.targetY = this.aimHeight * (0.5 - this.pitch / 0.50)
  }

  updateFocus(target, now) {
    if (target === this.focus) return
    this.focus = target
    this.focusSince = now
    this.latched = -1
    this.page.setChoiceFocus(target)
  }

  requireMove() {
    this.blockedAt = [this.x, this.y]
    this.updateFocus(-1, performance.now())
  }

  draw() {
    const page = this.page
    if (!this.active || !page) return
    const now = performance.now()
    const transition = this.transition ? Math.min(1, (now - this.startedAt) / TRANSITION_MS) : 1
    if (!this.ready && transition >= 1) {
      if (this.transition) this.center()
      this.ready = true
      this.readyAt = this.sensorStartedAt = now
      page.showChoiceControls(!!this.fallback)
    }
    if (this.ready && this.sensor && now - (this.lastReadingAt ?? this.sensorStartedAt) > SENSOR_TIMEOUT_MS) {
      this.sensorFailed(this.sensorKind)
    }
    const { width, height, boxes } = this.layout
    if (!this.context) {
      try { this.context = this.createCanvas() } catch { /* 首帧未挂载时等下一帧。 */ }
    }
    const ctx = this.context
    if (this.ready && !this.fallback && !ctx && now - this.readyAt >= SENSOR_TIMEOUT_MS) {
      this.canvasUnavailable = true
      page.showChoiceControls(true)
    }
    if (ctx) ctx.clearRect(0, 0, width, height)
    if (!this.ready) {
      if (ctx) drawTunnel(ctx, width, height, transition)
    } else if (ctx) {
      page.drawAimUnderlay?.(ctx)
    }
    if (this.ready && !this.fallback && ctx) {
      if (!this.firstFrame) {
        const x = clamp(this.targetX, 13, Math.max(13, width - 13))
        const y = clamp(this.targetY, 13, Math.max(13, height - 13))
        this.x += clamp((x - this.x) * 0.33, -MAX_CURSOR_STEP_PX, MAX_CURSOR_STEP_PX)
        this.y += clamp((y - this.y) * 0.33, -MAX_CURSOR_STEP_PX, MAX_CURSOR_STEP_PX)
      }
      this.firstFrame = false
      if (this.blockedAt && Math.hypot(this.x - this.blockedAt[0], this.y - this.blockedAt[1]) > 15) {
        this.blockedAt = null
      }
      const fresh = this.lastReadingAt != null && now - this.lastReadingAt <= READING_GAP_MS
      const { choiceAvailable } = page.data
      const target = fresh && !this.blockedAt ? boxes.findIndex((box, index) => choiceAvailable[index] &&
        this.x >= box.x && this.x < box.x + box.width && this.y >= box.y && this.y < box.y + box.height) : -1
      this.updateFocus(target, now)
      const held = target === -1 ? 0 : now - this.focusSince
      drawReticle(ctx, this.x, this.y, Math.min(1, held / DWELL_MS))
      if (target !== -1 && target !== this.latched && held >= DWELL_MS + CONFIRM_FRAME_MS) {
        this.latched = target
        page.confirmChoice(target)
      }
    }
    if (!this.active || this.page !== page) return
    if (ctx) ctx.flush()
    if (!this.ready || (!this.fallback && !this.canvasUnavailable) || (ctx && page.drawAimUnderlay)) {
      this.frame = requestAnimationFrame(() => this.draw())
    }
  }
}

    const find = id => document.getElementById(id)
    const screen = find('screen')
    const scene = find('scene')
    const panel = find('choice-panel')
    const canvas = find('canvas')
    const status = find('status')
    const hint = find('hint')
    const checkbox = find('only-guide')
    const cards = ['guide', 'instrumental', 'phrase'].map(find)
    const layout = songChoiceLayout()
    const context = canvas.getContext('2d')
    context.flush = () => {}
    Object.assign(scene.style, { width: layout.width + 'px', height: layout.height + 'px' })
    canvas.width = layout.width
    canvas.height = layout.height
    cards.forEach((card, index) => { card.style.cssText = layout.boxes[index].style })

    const neutralHint = '转头瞄准 · 停留一圈确认 · 双击镜腿返回'
    const neutralPose = [0, 0, 0, 1]
    let pose = neutralPose
    let choice
    let ready = false
    let lastTempleTap = null
    let keyboardX = layout.width / 2
    let keyboardY = layout.height / 2

    // Deliver a simulated orientation reading to the same controller used by the glasses.
    class PreviewOrientation extends EventTarget {
      start() {
        this.timer = setInterval(() => {
          this.quaternion = pose
          this.hasReading = true
          this.dispatchEvent(new Event('reading'))
        }, 1000 / 60)
      }
      stop() { clearInterval(this.timer) }
    }
    const AbsoluteOrientationSensor = PreviewOrientation

    const page = {
      data: { choiceAvailable: [true, true, true] },
      showChoiceControls() {
        ready = true
        panel.hidden = false
        status.textContent = '移动准星体验停留确认'
      },
      setChoiceFocus(index) {
        cards.forEach((card, cardIndex) => card.classList.toggle('choice-active', cardIndex === index))
        hint.textContent = neutralHint
      },
      confirmChoice(index) {
        if (index === 2) {
          hint.textContent = '「练这一句」暂未开放 · 双击镜腿返回'
          status.textContent = '「练这一句」暂未开放'
          return
        }
        const name = cards[index].querySelector('.choice-label').textContent
        stopChoice()
        scene.hidden = true
        find('result').hidden = false
        find('chosen-version').textContent = name
        status.textContent = '已确认 · ' + name
      }
    }

    function updateAvailability() {
      page.data.choiceAvailable[1] = !checkbox.checked
      cards[1].classList.toggle('choice-disabled', checkbox.checked)
      cards[1].querySelector('.choice-desc').textContent = checkbox.checked ? '还未下载此音频' : '纯伴奏 · 自己唱'
    }

    function stopChoice() {
      choice?.stop()
      choice = undefined
      ready = false
      lastTempleTap = null
      pose = neutralPose
    }

    function openChoice() {
      stopChoice()
      panel.hidden = true
      find('library').hidden = true
      find('result').hidden = true
      scene.hidden = false
      page.setChoiceFocus(-1)
      keyboardX = layout.width / 2
      keyboardY = layout.height / 2
      status.textContent = '穿越转场中'
      choice = new SongChoice(page, layout, () => context)
      choice.start()
    }

    function showLibrary() {
      stopChoice()
      scene.hidden = true
      find('result').hidden = true
      find('library').hidden = false
      status.textContent = '已返回歌单'
    }

    function aim(x, y) {
      if (!ready || !choice?.basePose) return
      const yaw = -(x / layout.width - 0.5) * 0.65
      const pitch = (0.5 - y / layout.height) * 0.50
      const sy = Math.sin(yaw / 2)
      const cy = Math.cos(yaw / 2)
      const sp = Math.sin(pitch / 2)
      const cp = Math.cos(pitch / 2)
      pose = [cy * sp, sy * cp, -sy * sp, cy * cp]
    }

    function point(event) {
      const rect = screen.getBoundingClientRect()
      aim(event.clientX - rect.left, event.clientY - rect.top)
    }

    screen.addEventListener('pointermove', point)
    screen.addEventListener('pointerdown', point)
    screen.addEventListener('pointerleave', () => { pose = neutralPose })
    screen.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        showLibrary()
        return
      }
      const steps = { ArrowLeft: [-47, 0], ArrowRight: [47, 0], ArrowUp: [0, -35], ArrowDown: [0, 35] }
      const step = steps[event.key]
      if (!ready || !step) return
      event.preventDefault()
      keyboardX = Math.max(0, Math.min(layout.width, keyboardX + step[0]))
      keyboardY = Math.max(0, Math.min(layout.height, keyboardY + step[1]))
      aim(keyboardX, keyboardY)
    })
    find('temple').addEventListener('click', () => {
      if (!find('library').hidden) return
      const now = performance.now()
      if (lastTempleTap != null && now - lastTempleTap <= 350) showLibrary()
      else lastTempleTap = now
    })
    screen.addEventListener('dblclick', () => { if (find('library').hidden) showLibrary() })
    find('replay').addEventListener('click', openChoice)
    find('choose-song').addEventListener('click', openChoice)
    checkbox.addEventListener('change', updateAvailability)
    updateAvailability()
    openChoice()
  </script>
</body>
</html>
